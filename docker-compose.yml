# ローカル開発専用。本番は Render(Rails) / Vercel(Next.js) / Neon(DB) を使い、
# 環境変数は各プラットフォームのダッシュボードで設定する（このファイルは使わない）。
#
# 初回セットアップ:
#   cp .env.example .env.development
#   cp frontend/.env.example frontend/.env.development
services:
  db:
    image: postgres:16
    env_file:
      - .env.development
    environment:
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # $$ は compose に展開させず、コンテナ内のシェルで env_file の値を解決させるため。
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # イメージ名を固定する。backend-e2e がこの名前で同じイメージを使い回すため、
    # プロジェクト名（既定はディレクトリ名）から決まる名前に頼らない。
    image: kotoe-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      # 共通の値（DB接続・CORS）はルート。
      - .env.development
      # Rails 専用の秘密（JWT_SECRET_KEY / CLOUDINARY_URL / 将来の OPENAI_API_KEY）は
      # こちらに分ける。このファイルは backend サービスの env_file にしか無いため、
      # db / frontend コンテナには渡らない（秘密の到達範囲を最小にする）。
      - backend/.env.development
    environment:
      RAILS_ENV: development
      TZ: Asia/Tokyo
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      # gem をホストのバインドマウントから切り離す
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - frontend/.env.development
    environment:
      TZ: Asia/Tokyo
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      # ホストの node_modules でコンテナ内のものを上書きさせない。
      # このボリュームはイメージ内の node_modules から初回に作られるため、ベースイメージを
      # 変えたときは `docker volume rm kotoe_node_modules` で作り直すこと（古い中身が残る）。
      - node_modules:/app/node_modules
    command: npm run dev

  # ジョブワーカー（Solid Queue）。本番（Render 無料枠）は Puma プラグインで Web プロセス内に
  # 同居させるが、ローカルは別サービスに分ける。ジョブのログがリクエストログと混ざらず、
  # ジョブを書き換えたときに Rails サーバーを落とさず再起動できるため。
  #
  # Solid Queue は開発環境でもジョブのコードを自動リロードしない。app/jobs 配下を編集したら
  # `docker compose restart worker` すること。
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      # backend と同じ 2 本。ワーカーは DB へ接続し、4-2 以降は Cloudinary と
      # 画像生成 API のキーも使うため、backend と同じ秘密の到達範囲が要る。
      - .env.development
      - backend/.env.development
    environment:
      RAILS_ENV: development
      # backend と揃える。ずれると 4-2 の生成回数の日次上限の日付境界がずれる。
      TZ: Asia/Tokyo
      # bin/jobs には `rails server` のような STDOUT ブロードキャストが無い。これを立てないと
      # ログが backend と共有の log/development.log に埋もれる。
      RAILS_LOG_TO_STDOUT: "true"
      # debug のままだと polling_interval ごとのポーリング SQL でログが埋まる。
      # ジョブ自身のログ（Rails.logger.info）は info なので残る。
      RAILS_LOG_LEVEL: info
    volumes:
      - ./backend:/app
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    # depends_on は db の healthy までしか待たず、マイグレーション適用は待たない。
    # 初回 clone 時は solid_queue_* テーブルが無い状態で起動して即死するため、
    # db:migrate 後に自力で復帰できるようにしておく。
    restart: on-failure
    # HTTP を受けないのでポートは公開しない。
    command: bundle exec bin/jobs

  # ---- E2E 専用（profile: e2e）。`docker compose up` の既定では起動しない。----
  # e2e/scripts/run-local.sh から使う。開発環境（backend :3000 / frontend :3001 / DB kotoe_development）
  # には触れず、別ポート・別 DB（kotoe_e2e）・別 Cloudinary フォルダで動かす。
  backend-e2e:
    profiles: ["e2e"]
    # backend と同じイメージを使い回す（同じ Dockerfile.dev なので、別名で再ビルドすると
    # apt / gem の取得がもう一度走る）。backend のイメージが無いときだけここで build される。
    image: kotoe-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env.development
      - backend/.env.development
    environment:
      RAILS_ENV: development
      TZ: Asia/Tokyo
      CORS_ALLOWED_ORIGINS: http://localhost:3101
      # E2E ではワーカーを別に立てず、Puma 内で Solid Queue を動かす。
      SOLID_QUEUE_IN_PUMA: "true"
      RAILS_LOG_TO_STDOUT: "true"
      # backend/.env.development で openai に切り替えていても、E2E では本物の画像生成 API を
      # 呼ばない（課金される）。environment は env_file より優先される。
      KOTOE_IMAGE_PROVIDER: dummy
      # 未設定でも compose 全体が読めるよう既定値を置く（:? で必須にすると通常の docker compose が全部落ちる）。
      # 通常は run-local.sh が実行ごとの値を export する。
      KOTOE_CLOUDINARY_FOLDER: ${KOTOE_CLOUDINARY_FOLDER:-kotoe/e2e/manual}
    ports:
      - "3100:3000"
    volumes:
      - ./backend:/app
      - bundle:/usr/local/bundle
      # 下の entrypoint。読み取り専用で載せる。
      - ./e2e/docker/backend-e2e-env.sh:/e2e/backend-e2e-env.sh:ro
    depends_on:
      db:
        condition: service_healthy
    # entrypoint.dev.sh は共有の tmp/pids/server.pid を消す。開発の backend の pid を
    # 巻き添えにしないよう entrypoint を差し替え、pid ファイルは /tmp に置く。
    # 差し替え先は DATABASE_URL の DB 名を kotoe_e2e にしてからコマンドを実行する。
    # run-local.sh の DB の作り直しと後片付け（docker compose run）も同じ entrypoint を通る。
    entrypoint: ["sh", "/e2e/backend-e2e-env.sh"]
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3000", "-P", "/tmp/server.pid"]

  # ソースは COPY して本番ビルドする。バインドマウントしないので、ホストの .next と
  # 開発用の frontend には触れない。
  frontend-e2e:
    profiles: ["e2e"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - frontend/.env.development
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3100
      TZ: Asia/Tokyo
    ports:
      - "3101:3000"
    command: sh -c "npx next build && npx next start -p 3000"

volumes:
  db_data:
  bundle:
  node_modules:
