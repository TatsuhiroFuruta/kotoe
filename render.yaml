# Render Blueprint。Rails をネイティブ Ruby ランタイムでデプロイする。
# 秘密/環境依存の値（sync: false）は Render ダッシュボードで手入力する。
# 手順は docs/deployment.md を参照。
services:
  - type: web
    name: kotoe-api
    runtime: ruby
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - { key: RAILS_ENV, value: production }
      - { key: TZ, value: Asia/Tokyo }
      - { key: RAILS_MAX_THREADS, value: "3" }
      - { key: JWT_SECRET_KEY, generateValue: true }
      - { key: RAILS_MASTER_KEY, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: CORS_ALLOWED_ORIGINS, sync: false }
      - { key: CORS_ALLOWED_ORIGIN_REGEX, sync: false }
      - { key: CLOUDINARY_URL, sync: false }
      # Solid Queue のワーカーを Puma プロセス内で起動する（config/puma.rb）。
      # 無料プランではバックグラウンドワーカーが別サービス扱いで有料になるため。
      - { key: SOLID_QUEUE_IN_PUMA, value: "true" }
      # 画像生成（issue 4-3）。キーは api_secret と同じくサーバー専用。
      # 未設定のまま provider が openai だと boot で raise する（設定漏れに
      # 気づかないままデプロイが green に見えるのを防ぐため）。
      - { key: OPENAI_API_KEY, sync: false }
      - { key: KOTOE_IMAGE_PROVIDER, value: openai }
      # 生成の緊急停止。コードを触らずダッシュボードだけで止められる。
      # 既定は有効なので、平常時は設定しなくてよい（止めるときだけ false を入れる）。
      # 全体の1日上限（既定 50 枚）も KOTOE_SERVICE_DAILY_GENERATION_LIMIT で
      # 上書きできる。値の根拠は docs/deployment.md の「OpenAI（画像生成）」。
