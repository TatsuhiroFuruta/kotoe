name: CI

# main への PR と、main への push で回す。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: backend (rubocop / rspec)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kotoe_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      # database.yml は test 環境でこの URL の DB 名を kotoe_test に差し替える。
      DATABASE_URL: postgresql://postgres:password@localhost:5432/kotoe_development
      # CORS の spec が「許可オリジン」を検証するために要る。
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      # JWT の署名鍵。CI は使い捨てなので固定のダミー値でよい（本番の鍵は Render に置く）。
      JWT_SECRET_KEY: dummy-jwt-secret-for-ci-do-not-use-in-production

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Ruby のセットアップ（gem はキャッシュする）
        uses: ruby/setup-ruby@v1
        with:
          # backend/.ruby-version を見る
          bundler-cache: true
          working-directory: backend

      - name: テスト用DBを用意する
        run: bin/rails db:prepare

      - name: rubocop
        run: bundle exec rubocop

      - name: rspec
        run: bundle exec rspec

      # Solid Queue のジョブ実行スレッド数に対して DB の接続プールが足りているかを、
      # 本番と同じ RAILS_MAX_THREADS で検証する。足りないと長いジョブが重なったときに
      # ActiveRecord::ConnectionTimeoutError で間欠的に落ち、切り分けが難しい。
      # ローカルは RAILS_MAX_THREADS 未設定でプールに余裕があるため、ここでしか出ない。
      #
      # `bin/jobs check` は警告を出しても exit 0 を返すため、警告の有無で明示的に落とす。
      - name: solid queue の設定チェック
        env:
          RAILS_MAX_THREADS: 3
        run: |
          output=$(bundle exec bin/jobs check 2>&1)
          echo "$output"
          if echo "$output" | grep -qi "^Warning:"; then
            echo "::error::Solid Queue の設定に警告があります（config/database.yml の max_connections を確認）"
            exit 1
          fi

  security:
    name: backend (brakeman / bundler-audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Ruby のセットアップ（gem はキャッシュする）
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      # Rails コードの静的セキュリティ解析（SQLインジェクション、マスアサインメント等）。
      - name: brakeman
        run: bundle exec brakeman --no-pager

      # 既知の脆弱性が報告されている gem を使っていないか、Gemfile.lock を検査する。
      - name: bundler-audit
        run: |
          bundle exec bundler-audit update
          bundle exec bundler-audit check
